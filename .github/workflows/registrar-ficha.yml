name: Registrar nova ficha no Supabase

on:
  push:
    branches: [main]
    paths:
      - "content/aiv-catalogo/**/*.md"

jobs:
  registrar:
    name: Registrar fichas publicadas neste push
    runs-on: ubuntu-latest
    # `on: push` roda 1x por push, não 1x por commit — por isso o gate e a
    # extração olham TODOS os commits do push (github.event.commits), não só
    # o head_commit. Um push com N commits, onde só alguns têm "nova-ficha:",
    # tem que registrar as fichas desses commits mesmo que o commit mais
    # recente do push seja, por exemplo, um "fix:" sem essa marcação.
    if: contains(toJSON(github.event.commits), 'nova-ficha:')
    steps:
      - name: Registrar cada ficha de cada commit do push
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          COMMITS_JSON: ${{ toJSON(github.event.commits) }}
        run: |
          set -e
          # Convenção: uma linha "nova-ficha: <tipo> <slug>" por ficha, em
          # qualquer commit do push. tipo é um de:
          # conceito | metodologia | ferramenta | caso-de-uso | produto | faq
          MESSAGES=$(node -e "
            const commits = JSON.parse(process.env.COMMITS_JSON);
            for (const c of commits) console.log(c.message);
          ")
          MATCHES=$(echo "$MESSAGES" | grep -oE 'nova-ficha:[[:space:]]*[a-z-]+[[:space:]]+[a-z0-9-]+' | sort -u || true)

          if [ -z "$MATCHES" ]; then
            echo "::error::nenhuma linha 'nova-ficha: <tipo> <slug>' encontrada nos commits deste push"
            exit 1
          fi

          echo "$MATCHES" | while IFS= read -r LINHA; do
            DADOS=$(echo "$LINHA" | sed -n 's/.*nova-ficha:[[:space:]]*\(.*\)/\1/p' | xargs)
            TIPO=$(echo "$DADOS" | cut -d' ' -f1)
            SLUG=$(echo "$DADOS" | cut -d' ' -f2-)

            # generate.mjs achata todas as URLs de ficha sob /conceitos/,
            # independente da categoria de origem — não é bug, é o layout real do site.
            URL="https://aiv.monicamelosales.com.br/conceitos/${SLUG}.html"
            TITULO=$(echo "$SLUG" | sed 's/-/ /g' | sed -E 's/(^| )([a-z])/\1\U\2/g')

            echo "Registrando: tipo=$TIPO slug=$SLUG"
            curl -sf -X POST "${SUPABASE_URL}/rest/v1/catalogo_fichas?on_conflict=slug" \
              -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
              -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
              -H "Content-Type: application/json" \
              -H "Prefer: return=minimal,resolution=merge-duplicates" \
              -d "{
                \"titulo\": \"${TITULO}\",
                \"tipo\": \"${TIPO}\",
                \"slug\": \"${SLUG}\",
                \"url\": \"${URL}\",
                \"data_publicacao\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"
              }"
            echo "OK: ${TITULO}"
          done
